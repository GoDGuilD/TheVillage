; File: export_presets.cfg
; Description: Godot export presets for The Village. Windows Desktop beta build (single EXE, embedded PCK,
;   custom icon) into H:\PROJECTS\Exported Games, like Chapel of Dreams. The *.json include filter is required:
;   the game reads localization, data, area and manifest JSON files at run time.
; Author: Jose-Jorge HERNANDEZ
; Company: Parlee Conseiller, Inc.
; Date: 2026-10-22
; Last edit date: 2026-10-22
; Version: 1.1.0
; Note: saving from the Godot editor drops these comments; restore them if that happens.
; Keep addons/ in the export: the enabled godot_mcp editor plugin registers a runtime autoload at export time,
;   so excluding it makes the EXE log a failed autoload. The probe is inert without a debugger attached.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, tools/*, tmp/*, docs/*, technical_memory/*, assets/reference/*, artifacts/*"
export_path="../../PROJECTS/Exported Games/The Village.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/branding/thevillageicon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="8.1.0.0"
application/product_version="8.1.0.0"
application/company_name="GoDGuilD StudioS"
application/product_name="The Village"
application/file_description="The Village (beta)"
application/copyright="2026, Parlee Conseiller, Inc."
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
